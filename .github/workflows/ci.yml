name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec turbo run lint --filter=web...
      - name: Typecheck
        run: pnpm exec turbo run typecheck --filter=web...
      - name: Bundled demo assets
        run: pnpm --filter web test
      - name: Build
        run: pnpm exec turbo run build --filter=web...

  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate contracts and deterministic simulator
        run: pnpm exec turbo run lint typecheck test --filter=@cubeos/contracts --filter=@cubeos/simulator --filter=@cubeos/api-client

  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs: [web, contracts, go, docker, browser, auth, media, recovery]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require applicable checks to pass
        env:
          WEB_RESULT: ${{ needs.web.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          GO_RESULT: ${{ needs.go.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          AUTH_RESULT: ${{ needs.auth.result }}
          MEDIA_RESULT: ${{ needs.media.result }}
          RECOVERY_RESULT: ${{ needs.recovery.result }}
        run: test "$WEB_RESULT" = success && test "$CONTRACTS_RESULT" = success && test "$GO_RESULT" = success && test "$DOCKER_RESULT" = success && test "$BROWSER_RESULT" = success && test "$AUTH_RESULT" = success && test "$MEDIA_RESULT" = success && test "$RECOVERY_RESULT" = success

  recovery:
    name: restore-railway-config
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache-dependency-path: apps/api/go.sum
      - name: Evaluate offline Railway configuration with pinned SDK
        run: |
          pnpm install --frozen-lockfile
          node --experimental-strip-types --test infra/railway/config.test.mjs
      - name: Real private recovery, TLS proxy and container gates
        run: bash infra/recovery/tests/run.sh

  browser:
    name: browser-live-telemetry
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CUBEOS_WEB_URL: http://localhost:3108
      CUBEOS_BROWSER_API_PORT: '8087'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache-dependency-path: apps/api/go.sum
      - name: Prepare browser, API and standalone web
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter web exec playwright install --with-deps chromium
          cd apps/api
          go build -o "$RUNNER_TEMP/cubeos-pr7-api" ./cmd/server
          cd ../..
          pnpm --filter web build
      - name: PostgreSQL cold-start readiness regression
        run: bash infra/docker/tests/postgres-ready.sh infra/docker/wait-postgres.sh
      - name: Exclusive PostgreSQL and prepared web
        run: |
          POSTGRES_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$POSTGRES_PASSWORD"
          export POSTGRES_PASSWORD
          docker run -d --name cubeos-browser-pg -e POSTGRES_PASSWORD -p 127.0.0.1:55437:5432 postgres:17.6-alpine
          export PGPASSWORD="$POSTGRES_PASSWORD"
          bash infra/docker/wait-postgres.sh 55437
          createdb -h 127.0.0.1 -p 55437 -U postgres cubeos_browser_test
          echo "TEST_BROWSER_DATABASE_URL=postgres://postgres:$POSTGRES_PASSWORD@localhost:55437/cubeos_browser_test?sslmode=disable" >> "$GITHUB_ENV"
          echo "CUBEOS_BROWSER_PG_CONTAINER=cubeos-browser-pg" >> "$GITHUB_ENV"
          echo "CUBEOS_API_BINARY=$RUNNER_TEMP/cubeos-pr7-api" >> "$GITHUB_ENV"
          echo "CUBEOS_BROWSER_EVIDENCE_DIR=$RUNNER_TEMP/cubeos-browser-evidence" >> "$GITHUB_ENV"
          pnpm --filter web start --port 3108 > "$RUNNER_TEMP/cubeos-web.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:3108/visor > /dev/null && break; sleep 1; done
          curl -fsS http://localhost:3108/visor > /dev/null
      - name: Real REST/SSE simulator, local offline and desktop/mobile browser gates
        run: node apps/web/tests/browser-integration.mjs
      - name: Prepared Next runtime public/local authentication boundaries
        env:
          CUBEOS_AUTH_EVIDENCE_DIR: ${{ runner.temp }}/cubeos-auth-runtime
        run: node apps/web/tests/browser-auth-runtime.mjs

  go:
    name: go-postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: ci-disposable
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:ci-disposable@localhost:5432/cubeos_http_test?sslmode=disable
      TEST_MIGRATION_DATABASE_URL: postgres://postgres:ci-disposable@localhost:5432/cubeos_migrations_test?sslmode=disable
      TEST_INGESTION_DATABASE_URL: postgres://postgres:ci-disposable@localhost:5432/cubeos_ingestion_test?sslmode=disable
      TEST_TRANSPORT_DATABASE_URL: postgres://postgres:ci-disposable@localhost:5432/cubeos_transport_test?sslmode=disable
      TEST_REALTIME_DATABASE_URL: postgres://postgres:ci-disposable@localhost:5432/cubeos_realtime_test?sslmode=disable
      TEST_AUTH_DATABASE_URL: postgres://postgres:ci-disposable@localhost:5432/cubeos_auth_test?sslmode=disable
      TEST_CONSTRUCTION_DATABASE_URL: postgres://postgres:ci-disposable@localhost:5432/cubeos_construction_test?sslmode=disable
      TEST_MEDIA_DATABASE_URL: postgres://postgres:ci-disposable@localhost:5432/cubeos_media_test?sslmode=disable
      TEST_MEDIA_SERVICE_DATABASE_URL: postgres://postgres:ci-disposable@localhost:5432/cubeos_media_service_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache-dependency-path: apps/api/go.sum
      - name: Create isolated integration databases
        env:
          PGPASSWORD: ci-disposable
        run: |
          createdb -h localhost -U postgres cubeos_http_test
          createdb -h localhost -U postgres cubeos_migrations_test
          createdb -h localhost -U postgres cubeos_ingestion_test
          createdb -h localhost -U postgres cubeos_transport_test
          createdb -h localhost -U postgres cubeos_realtime_test
          createdb -h localhost -U postgres cubeos_auth_test
          createdb -h localhost -U postgres cubeos_construction_test
          createdb -h localhost -U postgres cubeos_media_test
          createdb -h localhost -U postgres cubeos_media_service_test
      - name: Format, vet and race tests against PostgreSQL
        working-directory: apps/api
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          export TEST_PROJECTION_EVIDENCE_DIR="$RUNNER_TEMP/cubeos-projections"
          go test -race -count=1 -v ./...
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false
      - name: Install frozen schema validator dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate persisted late snapshots with the shared TypeScript schema
        run: pnpm --filter @cubeos/contracts exec node tests/verify-postgres-snapshots.ts "$RUNNER_TEMP/cubeos-projections"
      - name: Actual simulator CLI through HTTP and PostgreSQL
        run: |
          cd apps/api
          go build -o "$RUNNER_TEMP/cubeos-api" ./cmd/server
          cd ../..
          CUBEOS_API_BINARY="$RUNNER_TEMP/cubeos-api" node tools/simulator/tests/postgres-http-smoke.ts

  auth:
    name: auth-browser-isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: ci-disposable
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_AUTH_DATABASE_URL: postgres://postgres:ci-disposable@localhost:5432/cubeos_auth_browser_test?sslmode=disable
      CUBEOS_AUTH_BROWSER: '1'
      CUBEOS_CONSTRUCTION_BROWSER: '1'
      TEST_CONSTRUCTION_BROWSER_DATABASE_URL: postgres://postgres:ci-disposable@localhost:5432/cubeos_construction_browser_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache-dependency-path: apps/api/go.sum
      - name: Prepare fixture browser and exclusive database
        env:
          PGPASSWORD: ci-disposable
        run: |
          createdb -h localhost -U postgres cubeos_auth_browser_test
          createdb -h localhost -U postgres cubeos_construction_browser_test
          pnpm install --frozen-lockfile
          pnpm --filter web exec playwright install --with-deps chromium
      - name: Signed JWT, real Go/PostgreSQL REST/SSE and React account boundaries
        working-directory: apps/api
        run: go test -race -count=1 -v ./internal/http -run TestPublicIdentityOwnershipRevocationAndBrowser
      - name: Signed construction saved progress and delayed account/device boundaries
        working-directory: apps/api
        run: go test -race -count=1 -v ./internal/http -run TestConstructionSignedBrowser

  media:
    name: media-postgres-s3-browser
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache-dependency-path: apps/api/go.sum
      - name: Prepare isolated PostgreSQL and private S3 with ephemeral credentials
        run: |
          export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          export RUSTFS_ACCESS_KEY="pr10$(openssl rand -hex 8)"
          export RUSTFS_SECRET_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "::add-mask::$RUSTFS_ACCESS_KEY"
          echo "::add-mask::$RUSTFS_SECRET_KEY"
          docker run -d --name cubeos-media-pg -e POSTGRES_PASSWORD -p 127.0.0.1:55440:5432 postgres:17.6-alpine
          docker run -d --name cubeos-media-s3 -e RUSTFS_ACCESS_KEY -e RUSTFS_SECRET_KEY -e RUSTFS_CONSOLE_ENABLE=false -p 127.0.0.1:59040:9000 -v cubeos-media-s3-data:/data rustfs/rustfs:1.0.0-rc.6-glibc@sha256:b73a77ef70000722d985193e644d30882c57d7cb8f64c06bd329eb7969b03d52 /data
          export PGPASSWORD="$POSTGRES_PASSWORD"
          bash infra/docker/wait-postgres.sh 55440
          createdb -h 127.0.0.1 -p 55440 -U postgres media_http
          createdb -h 127.0.0.1 -p 55440 -U postgres media_service
          createdb -h 127.0.0.1 -p 55440 -U postgres media_browser
          createdb -h 127.0.0.1 -p 55440 -U postgres media_restart
          echo "TEST_MEDIA_DATABASE_URL=postgres://postgres:$POSTGRES_PASSWORD@localhost:55440/media_http?sslmode=disable" >> "$GITHUB_ENV"
          echo "TEST_MEDIA_SERVICE_DATABASE_URL=postgres://postgres:$POSTGRES_PASSWORD@localhost:55440/media_service?sslmode=disable" >> "$GITHUB_ENV"
          echo "TEST_MEDIA_BROWSER_DATABASE_URL=postgres://postgres:$POSTGRES_PASSWORD@localhost:55440/media_browser?sslmode=disable" >> "$GITHUB_ENV"
          echo "TEST_MEDIA_RESTART_DATABASE_URL=postgres://postgres:$POSTGRES_PASSWORD@localhost:55440/media_restart?sslmode=disable" >> "$GITHUB_ENV"
          echo "TEST_S3_ENDPOINT=http://127.0.0.1:59040" >> "$GITHUB_ENV"
          echo "TEST_S3_BUCKET=cubeos-media-private" >> "$GITHUB_ENV"
          echo "TEST_S3_ACCESS_KEY=$RUSTFS_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "TEST_S3_SECRET_KEY=$RUSTFS_SECRET_KEY" >> "$GITHUB_ENV"
          echo "TEST_MEDIA_REQUIRED=1" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/media-tmp"
          echo "TMPDIR=$RUNNER_TEMP/media-tmp" >> "$GITHUB_ENV"
          pnpm install --frozen-lockfile
          pnpm --filter web exec playwright install --with-deps chromium
      - name: Shared local/S3 contract, failures/recovery and private HTTP PostgreSQL
        working-directory: apps/api
        run: go test -race -count=1 -v ./internal/media/... ./internal/http -run 'Test(MediaHTTP|MediaService|MediaConcurrent|MediaReconcile|LocalContract|S3Contract|Validation)'
      - name: Signed real media browser and private account/device/byte boundaries
        working-directory: apps/api
        env:
          CUBEOS_MEDIA_BROWSER: '1'
        run: go test -race -count=1 -v ./internal/http -run TestMediaSignedBrowser
      - name: Preserve exact originals across API, DB and S3 service restarts
        env:
          CUBEOS_MEDIA_RESTART: '1'
          CUBEOS_MEDIA_PG_CONTAINER: cubeos-media-pg
          CUBEOS_MEDIA_S3_CONTAINER: cubeos-media-s3
        working-directory: apps/api
        run: go test -race -count=1 -v ./internal/http -run TestMediaS3PersistedRestart

  docker:
    name: docker-local
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and start isolated local installation
        env:
          POSTGRES_PASSWORD: ci-disposable
        run: docker compose -p cubeos-ci -f infra/docker/compose.yaml up --build -d
      - name: Smoke, restart, persistence and offline runtime
        env:
          POSTGRES_PASSWORD: ci-disposable
        run: bash infra/docker/smoke.sh cubeos-ci
      - name: Logs on failure
        if: failure()
        env:
          POSTGRES_PASSWORD: ci-disposable
        run: docker compose -p cubeos-ci -f infra/docker/compose.yaml logs --no-color
      - name: Remove this disposable CI installation
        if: always()
        env:
          POSTGRES_PASSWORD: ci-disposable
        run: docker compose -p cubeos-ci -f infra/docker/compose.yaml down -v
