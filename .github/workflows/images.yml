name: Trusted images

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Edwarmkaer/cubeos'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require trusted main ancestry
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD origin/main
          if [ "$REF_TYPE" = branch ]; then test "$REF_NAME" = main; fi
          if [ "$REF_TYPE" = tag ]; then [[ "$REF_NAME" =~ ^v[A-Za-z0-9_.-]+$ ]]; fi
      - name: Build versioned images without production configuration
        run: |
          set -euo pipefail
          for component in api web recovery; do
            dockerfile="infra/docker/Dockerfile.$component"
            if [ "$component" = recovery ]; then dockerfile=infra/recovery/Dockerfile; fi
            docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.source=https://github.com/Edwarmkaer/cubeos" \
              --label "org.opencontainers.image.version=sha-$GITHUB_SHA" \
              -f "$dockerfile" -t "ghcr.io/edwarmkaer/cubeos-$component:sha-$GITHUB_SHA" .
          done
      - name: Publish only this trusted revision
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          for component in api web recovery; do
            image="ghcr.io/edwarmkaer/cubeos-$component"
            docker push "$image:sha-$GITHUB_SHA"
            if [ "$REF_TYPE" = tag ]; then
              docker tag "$image:sha-$GITHUB_SHA" "$image:$REF_NAME"
              docker push "$image:$REF_NAME"
            fi
            docker image inspect --format '{{join .RepoDigests "\n"}}' "$image:sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          done
