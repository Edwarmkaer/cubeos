name: cubeos-local
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: cubeos
      POSTGRES_USER: cubeos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cubeos -d cubeos"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [local]
    restart: unless-stopped
  migrate:
    image: cubeos-api:pr3
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    command: [migrate]
    environment: &api-env
      DATABASE_URL: postgres://cubeos:${POSTGRES_PASSWORD}@db:5432/cubeos?sslmode=disable
      DEPLOYMENT_MODE: local
      AUTH_MODE: local
      LOCAL_CONTAINER: "true"
      LISTEN_HOST: 0.0.0.0
      PORT: ${API_PORT:-8080}
      ALLOWED_ORIGIN: http://localhost:${WEB_PORT:-3000}
    depends_on:
      db: {condition: service_healthy}
    networks: [local]
  api:
    image: cubeos-api:pr3
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    environment: *api-env
    ports: ["127.0.0.1:${API_PORT:-8080}:${API_PORT:-8080}"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [local]
    restart: unless-stopped
  web:
    image: cubeos-web:pr3
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    networks: [local]
    restart: unless-stopped
networks:
  local:
    driver: bridge
volumes:
  postgres-data:
