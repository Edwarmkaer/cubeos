services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: cubeos
      POSTGRES_USER: cubeos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Private runtime configuration required}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U cubeos -d cubeos']
      interval: 2s
      timeout: 3s
      retries: 45
    networks: [local]
    restart: unless-stopped
  migrate:
    image: ${CUBEOS_API_IMAGE:?Run local:setup}
    command: [migrate]
    environment: &api-env
      DATABASE_URL: postgres://cubeos:${POSTGRES_PASSWORD}@db:5432/cubeos?sslmode=disable
      DEPLOYMENT_MODE: local
      AUTH_MODE: local
      LOCAL_CONTAINER: 'true'
      LISTEN_HOST: 0.0.0.0
      PORT: ${API_PORT:-8080}
      ALLOWED_ORIGIN: http://localhost:${WEB_PORT:-3000}
      MEDIA_STORAGE: local
      MEDIA_LOCAL_ROOT: /data/media
      MEDIA_TEMP_ROOT: /data/media-staging
    depends_on:
      db: {condition: service_healthy}
    networks: [local]
  api:
    image: ${CUBEOS_API_IMAGE:?Run local:setup}
    environment: *api-env
    volumes: [media-data:/data/media, media-staging:/data/media-staging]
    ports: ['127.0.0.1:${API_PORT:-8080}:${API_PORT:-8080}']
    depends_on:
      db: {condition: service_healthy}
    networks: [local]
    restart: unless-stopped
  web:
    image: ${CUBEOS_WEB_IMAGE:?Run local:setup}
    environment:
      DEPLOYMENT_MODE: local
    ports: ['127.0.0.1:${WEB_PORT:-3000}:3000']
    networks: [local]
    restart: unless-stopped
networks:
  local:
    driver: bridge
volumes:
  postgres-data:
  media-data:
  media-staging:
