name: cubeos-dev
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: cubeos
      POSTGRES_USER: cubeos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup}
    ports:
      - "127.0.0.1:${PG_PORT:-54329}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U cubeos -d cubeos"]
      interval: 2s
      timeout: 3s
      retries: 40
volumes:
  postgres-data:
